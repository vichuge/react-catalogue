name: Linters & tests

on:
  pull_request:
  push:
    branches: [development]

env:
  FORCE_COLOR: 1

jobs:
  checks:
    name: ESLint, Stylelint & Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: ESLint Report
        run: npx eslint .
      - name: Stylelint Report
        run: npx stylelint "**/*.css"
      - name: Tests
        run: npm test -- --watchAll=false
        env:
          CI: true
